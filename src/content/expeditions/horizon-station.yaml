journal:
  - day: "DAY 01"
    date: "14 FEB 2024 • −22°C"
    text: "We arrived in blue light. The sun will not rise for another nine days. We set camp where the wind seemed weakest — by morning, it had found us."
  - day: "DAY 07"
    date: "20 FEB 2024 • −18°C"
    text: "Mapped the snowdrift line along the ridge. Every structure built here in the last century sits on the wrong side of it."
  - day: "DAY 19"
    date: "04 MAR 2024 • −15°C"
    text: "First sketch. A single low line that follows the drift instead of fighting it. Everything after was refinement."
    accent: "Everything after was refinement."
  - day: "DAY 28"
    date: "13 MAR 2024 • −11°C"
    text: "Final walk. Marked the eleven points where the building will touch the ground. Nowhere else."
quote: "“The drift told us where to build. We only had to listen long enough.”"
