summary: "A research station on the Isfjorden coast, designed after 28 days of observation and built to disappear into the snowline."
site: "Isfjorden is a coast that rearranges itself every winter. Snow drifts migrate along the ridge, the fjord freezes and thaws, and for 94 days a year the sun never rises. The brief asked for a laboratory, twelve bunks and an observation deck. The site asked for something lower, quieter and lighter than anything built here before."
