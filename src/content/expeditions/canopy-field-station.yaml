summary: "A research station raised among the cedars, designed so that no tree older than the studio would be cut."
site: "The forest floor here belongs to bears and salmon. Rain falls on two hundred days a year and the oldest cedars predate every building in the province. The brief asked for a field station for twenty researchers. The site asked us to stay off the ground."
