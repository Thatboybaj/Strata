journal:
  - day: "DAY 01"
    date: "10 SEP 2023 • 12°C"
    text: "Rain for eleven hours. We learned to read the forest by sound before we could see it."
  - day: "DAY 09"
    date: "18 SEP 2023 • 11°C"
    text: "Counted 214 trees over five hundred years old within the study area. Every one is now on the drawings."
  - day: "DAY 21"
    date: "30 SEP 2023 • 10°C"
    text: "First sketch. A light frame threaded between the trunks, resting on nine points. The forest stays underneath."
    accent: "The forest stays underneath."
  - day: "DAY 33"
    date: "12 OCT 2023 • 9°C"
    text: "The salmon are back in the creek. We moved the access path a second time."
quote: "“We drew the trees first. The building is what was left.”"
