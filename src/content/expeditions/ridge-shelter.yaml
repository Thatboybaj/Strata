summary: "An emergency shelter on a glacier ridge above an active volcanic system, sited by its avalanche and meltwater paths."
site: "The ridge sits between an ice cap and a caldera. Meltwater floods arrive without warning and the snowpack shifts with every eruption tremor. The brief asked for a shelter for mountain rescue teams. The site asked for one placed where nothing would ever run through it."
