journal:
  - day: "DAY 01"
    date: "08 JUN 2026 • 1°C"
    text: "White-out on the approach. We found the ridge by following the sound of the meltwater."
  - day: "DAY 10"
    date: "17 JUN 2026 • 3°C"
    text: "Mapped every avalanche and flood path across the ridge. Only one spot was crossed by none."
  - day: "DAY 20"
    date: "27 JUN 2026 • 2°C"
    text: "First sketch. A shelter on the one quiet spot, turned away from the caldera. The ridge chose the site."
    accent: "The ridge chose the site."
  - day: "DAY 26"
    date: "03 JUL 2026 • 4°C"
    text: "Foundations marked. The rescue teams named the spot before we had a drawing."
quote: "“Only one place on the ridge was crossed by nothing. That is where we built.”"
