journal:
  - day: "DAY 01"
    date: "12 MAR 2025 • 2°C"
    text: "Low tide at 06:10. We walked out to where the building might stand and were back on the beach by 09:00."
  - day: "DAY 06"
    date: "17 MAR 2025 • −1°C"
    text: "A storm moved the boulder we had been using as a datum. We started again with the cliff."
  - day: "DAY 13"
    date: "24 MAR 2025 • 1°C"
    text: "First sketch. A lab on slender legs, sea below at high tide and shore below at low. The coastline is never still."
    accent: "The coastline is never still."
  - day: "DAY 19"
    date: "30 MAR 2025 • 3°C"
    text: "Positioned the legs between kelp beds. The divers say the fish are already using the survey poles."
quote: "“The coastline is never still. Neither are we.”"
