summary: "A marine laboratory on a Lofoten shoreline, designed to sit between the high and low tide lines."
site: "The shoreline here is never the same twice a day. The tide range is three metres and winter storms move boulders the size of cars. The brief asked for a lab beside the water. The site asked for one that the water could pass under."
