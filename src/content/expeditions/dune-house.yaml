journal:
  - day: "DAY 01"
    date: "02 MAY 2024 • 31°C"
    text: "The wind erased our tracks before we reached camp. We stopped marking paths after that."
  - day: "DAY 12"
    date: "13 MAY 2024 • 29°C"
    text: "Fog nets up at 04:00. By sunrise each had collected a little over a litre."
  - day: "DAY 33"
    date: "03 JUN 2024 • 27°C"
    text: "First sketch. A house set in the lee of the dune, half buried, breathing through the fog. The rest followed the shade."
    accent: "The rest followed the shade."
  - day: "DAY 41"
    date: "11 JUN 2024 • 26°C"
    text: "The dune moved 1.4 metres while we were here. The house will move its entrance with it."
quote: "“The dune moved while we were drawing. So the house learned to move too.”"
