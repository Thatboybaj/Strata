summary: "A private retreat in the Namib, shaped by 41 days of watching the dunes move and built to move with them."
site: "The Namib redraws itself every season. Dunes travel metres a year, fog arrives from the Atlantic before dawn and is gone by nine. The brief asked for a house for four. The site asked for shade, a way to harvest the fog, and a footprint the sand could reclaim."
