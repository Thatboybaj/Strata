summary: "A desert research camp where the dunes moved farther than expected — and the building moved with them."
site: "The site lies on the edge of a dune field that advances toward the coast every year. Our survey showed the ground we were standing on would be under sand within a decade. The brief asked for a fixed camp. The site asked for one that could follow the ground."
