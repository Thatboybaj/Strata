  - day: "DAY 01"
    date: "04 APR 2025 • 33°C"
    text: "Set up the survey grid at dawn. By evening, three of the pegs were gone."
  - day: "DAY 14"
    date: "17 APR 2025 • 30°C"
    text: "Measured the dune front daily. It moved faster on the days we were not looking."
  - day: "DAY 30"
    date: "03 MAY 2025 • 29°C"
    text: "First sketch. Screw-pile foundations that can be lifted and reset. The camp will follow the ground."
    accent: "The camp will follow the ground."
  - day: "DAY 41"
    date: "14 MAY 2025 • 28°C"
    text: "Agreed a relocation plan with the foundation: every eight years, one hundred metres east."
