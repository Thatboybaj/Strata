summary: "A geological observatory on a live volcanic plateau. A vent opened on day nine and changed the entire masterplan."
site: "The highlands are still being made. Lava fields steam after rain, the ground shifts by centimetres each year, and on day nine a new vent opened four hundred metres from our camp. The brief asked for a permanent observatory. The site asked for something that could be moved."
