journal:
  - day: "DAY 01"
    date: "06 AUG 2024 • 9°C"
    text: "Black sand, white steam, green moss. The ground was warm under our sleeping mats."
  - day: "DAY 09"
    date: "14 AUG 2024 • 11°C"
    text: "A vent opened to the north at 03:40. We moved camp twice before breakfast."
  - day: "DAY 12"
    date: "17 AUG 2024 • 8°C"
    text: "First sketch. Six modules on sledges, each one able to leave on its own. Permanence was never on offer."
    accent: "Permanence was never on offer."
  - day: "DAY 17"
    date: "22 AUG 2024 • 7°C"
    text: "Agreed the three positions the modules can retreat to. The vent agreed with none of them."
quote: "“A vent opened on day nine. The masterplan opened with it.”"
