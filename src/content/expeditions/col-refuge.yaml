journal:
  - day: "DAY 01"
    date: "03 JAN 2025 • 6°C"
    text: "Lost a tent to the afternoon wind. Pitched the next one in the shadow of a boulder and slept well."
  - day: "DAY 08"
    date: "10 JAN 2025 • 4°C"
    text: "The boulders along the col all lean the same way. The wind has been designing here for a long time."
  - day: "DAY 15"
    date: "17 JAN 2025 • 5°C"
    text: "First sketch. A low stone back to the west, an open face to the valley. The boulders showed us how."
    accent: "The boulders showed us how."
  - day: "DAY 22"
    date: "24 JAN 2025 • 3°C"
    text: "Stone quarried from the moraine below. Nothing will be flown in that the valley can provide."
quote: "“The wind had already drawn the shelter. We only traced it in stone.”"
