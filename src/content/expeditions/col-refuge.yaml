summary: "A shelter on a high Patagonian pass, built in one season from what the mountain and the valley could give."
site: "The col sits where two valleys exchange their weather. Winds reach 150 km/h in the afternoon and drop to nothing by night. The brief asked for a refuge for sixteen hikers. The site asked for a building the wind could pass over."
